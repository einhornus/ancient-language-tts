[project]
name = "ancient-language-tts"
dynamic = ["version"]
description = "Text-to-speech for ancient languages, through a modern voice. Bring your own OpenRouter and ElevenLabs keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["tts", "ancient languages", "ipa", "elevenlabs", "openrouter", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai-slim[openrouter]>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Volume normalization of the generated audio (tts.normalize_volume).
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Local phoneme recognition for checking generated audio (ancient_language_tts.check).
check = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "lhotse>=1.20",
    "torch>=2.0",
    "huggingface_hub>=0.20",
    "soundfile>=0.12",
    "scipy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"  # print each language's report

[project.urls]
Homepage = "https://github.com/einhornus/ancient-language-tts"

[project.scripts]
ancient-language-tts = "ancient_language_tts.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "ancient_language_tts.__version__" }

[tool.setuptools.packages.find]
include = ["ancient_language_tts*"]

[tool.setuptools.package-data]
ancient_language_tts = ["data/*.json", "data/*/*.txt", "data/*/*.json", "data/*/respelling/*.txt"]
